name: Deploy StylusSafe to Arbitrum Sepolia

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: testnet
        type: choice
        options:
          - testnet
          - mainnet

jobs:
  deploy:
    name: Compile WASM + Deploy Contracts
    runs-on: ubuntu-latest
    env:
      PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
      CARGO_TARGET_DIR: /tmp/cargo-target

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust + WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/cargo-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-stylus
        run: cargo install cargo-stylus --locked
        env:
          CARGO_TARGET_DIR: /tmp/cargo-target-install

      - name: Write rust-toolchain.toml
        working-directory: contracts
        run: |
          RUST_VERSION=$(rustc --version | grep -oP '\d+\.\d+\.\d+')
          printf '[toolchain]\nchannel = "%s"\ntargets = ["wasm32-unknown-unknown"]\n' "$RUST_VERSION" > rust-toolchain.toml
          cat rust-toolchain.toml

      - name: Show Stylus.toml
        working-directory: contracts
        run: cat Stylus.toml

      - name: Deploy Stylus WASM contract
        id: deploy_wasm
        working-directory: contracts
        run: |
          set +e
          cargo stylus deploy \
            --endpoint "$RPC_URL" \
            --private-key "$PRIVATE_KEY" \
            --max-fee-per-gas-gwei 1 \
            --no-verify 2>&1 | tee /tmp/deploy.log
          EXIT_CODE=${PIPESTATUS[0]}
          cat /tmp/deploy.log
          ADDR=$(grep -oE 'deployed code at address: 0x[0-9a-fA-F]+' /tmp/deploy.log | awk '{print $NF}' || true)
          echo "wasm_address=$ADDR" >> $GITHUB_OUTPUT
          echo "Contract deployed at: $ADDR"
          exit $EXIT_CODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: contracts/package.json

      - name: Install contract deploy deps
        working-directory: contracts
        run: npm install ethers

      - name: Deploy StylusSafeFactory
        working-directory: contracts
        run: |
          node scripts/deploy_factory.mjs \
            --rpc "$RPC_URL" \
            --key "$PRIVATE_KEY" \
            --impl "${{ steps.deploy_wasm.outputs.wasm_address }}"

      - name: Record deployment
        if: success()
        run: |
          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "StylusSafe WASM: ${{ steps.deploy_wasm.outputs.wasm_address }}" >> $GITHUB_STEP_SUMMARY
          echo "https://sepolia.arbiscan.io/address/${{ steps.deploy_wasm.outputs.wasm_address }}" >> $GITHUB_STEP_SUMMARY
