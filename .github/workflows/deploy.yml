name: Deploy StylusSafe to Arbitrum Sepolia

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet

jobs:
  deploy:
    name: Compile WASM + Deploy Contracts
    runs-on: ubuntu-latest

    env:
      PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
      CARGO_TARGET_DIR: /tmp/cargo-target

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust + WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/cargo-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-stylus
        run: |
          cargo install cargo-stylus --locked
        env:
          CARGO_TARGET_DIR: /tmp/cargo-target-install

      - name: Deploy Stylus (WASM) contract
        id: deploy_wasm
        working-directory: contracts
        run: |
          # Write a fresh Stylus.toml via heredoc (avoids Windows CRLF issues)
          printf '[workspace]\nmembers = ["."]\ndefault-member = "."\n\n[networks.arbitrum-sepolia]\nendpoint = "https://sepolia-rollup.arbitrum.io/rpc"\n' > Stylus.toml
          echo "=== Stylus.toml (hex dump first 200 bytes) ==="
          xxd Stylus.toml | head -20
          echo "=== Stylus.toml (raw) ==="
          cat Stylus.toml
          echo "========================="
          set +e
          cargo stylus deploy \
            --endpoint $RPC_URL \
            --private-key $PRIVATE_KEY \
            --no-verify 2>&1 | tee /tmp/stylus-deploy.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "--- Full deploy output ---"
          cat /tmp/stylus-deploy.log
          WASM_ADDRESS=$(cat /tmp/stylus-deploy.log | grep -oP '(?<=contract address: )0x[0-9a-fA-F]+')
          echo "wasm_address=$WASM_ADDRESS" >> $GITHUB_OUTPUT
          echo "Deployed WASM at: $WASM_ADDRESS"
          exit $EXIT_CODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package.json

      - name: Install contract deploy deps
        working-directory: contracts
        run: npm install ethers

      - name: Deploy StylusSafeFactory (Solidity)
        working-directory: contracts
        run: |
          node scripts/deploy_factory.mjs \
            --rpc "$RPC_URL" \
            --key "$PRIVATE_KEY" \
            --impl "${{ steps.deploy_wasm.outputs.wasm_address }}"
        env:
          WASM_IMPLEMENTATION: ${{ steps.deploy_wasm.outputs.wasm_address }}

      - name: Record deployment addresses
        if: success()
        run: |
          echo "## Deployment Successful 🎉" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Address |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| StylusSafe WASM | ${{ steps.deploy_wasm.outputs.wasm_address }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View on [Arbiscan Sepolia](https://sepolia.arbiscan.io/address/${{ steps.deploy_wasm.outputs.wasm_address }})" >> $GITHUB_STEP_SUMMARY
