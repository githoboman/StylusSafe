[package]
name = "stylus-safe"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "stylus-safe"
path = "src/main.rs"

[dependencies]
alloy-primitives = { version = "=1.7.3", default-features = false }

stylus-sdk = { version = "=0.10.9" }

[features]
export-abi = ["stylus-sdk/export-abi"]
default = []

[profile.release]
codegen-units = 1
strip = true
lto = true
opt-level = "z"
panic = "abort"
